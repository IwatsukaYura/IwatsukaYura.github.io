name: Deploy Hugo site to GitHub Pages

on:
  # main への push でデプロイ
  push:
    branches: ["main"]
  # 毎日 06:00 JST (21:00 UTC) に外部記事(Zenn)を取り込んで再デプロイ
  schedule:
    - cron: "0 21 * * *"
  # 手動実行
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの同時実行を防ぐ（進行中のものは待つ）
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Tokyo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # hugo / go のバージョンは mise.toml の [tools] が唯一の定義
      - name: Setup mise (hugo / go)
        uses: jdx/mise-action@v4

      - name: Fetch external articles (Zenn)
        env:
          # 任意: Secrets に設定すると config/sources.json より優先されます
          ZENN_USER: ${{ secrets.ZENN_USER }}
        run: mise run fetch

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: mise run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
