name: Deploy Hugo site to GitHub Pages

on:
  # main への push でデプロイ
  push:
    branches: ["main"]
  # 毎日 06:00 JST (21:00 UTC) に外部記事(Qiita/Zenn)を取り込んで再デプロイ
  schedule:
    - cron: "0 21 * * *"
  # 手動実行
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの同時実行を防ぐ（進行中のものは待つ）
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.164.0"
      TZ: "Asia/Tokyo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go (Hugo Modules 解決 & 取り込みスクリプト用)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Fetch external articles (Qiita / Zenn)
        env:
          # 任意: Secrets に設定すると config/sources.json より優先されます
          QIITA_USER: ${{ secrets.QIITA_USER }}
          ZENN_USER: ${{ secrets.ZENN_USER }}
          # 任意: Qiita API のレート制限を緩和するトークン
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          cd tools/fetch-external
          go run .

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
