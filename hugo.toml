baseURL = "https://iwatsukayura.github.io/"
locale = "ja-jp"
defaultContentLanguage = "ja"
title = "Iwatsuka Yura Blog"
theme = ["github.com/adityatelange/hugo-PaperMod"]

# きれいなURL・SEO
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
pygmentsUseClasses = true

# ページネーション
[pagination]
  pagerSize = 10

# タクソノミー：タグ + 外部投稿元(source)でフィルタ可能に
[taxonomies]
  tag = "tags"
  source = "sources"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON は検索用

[params]
  env = "production"
  description = "技術ブログ。Qiita / Zenn の投稿もここに集約しています。"
  author = "Iwatsuka Yura"
  mainSections = ["posts", "external"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowRssButtonInSectionTermList = true
  displayFullLangName = true

  [params.homeInfoParams]
    Title = "Iwatsuka Yura Blog 👋"
    Content = "技術記事を書いています。このサイトでは自分で書いた記事に加え、Qiita・Zenn に投稿した記事もタグや年月で横断的に管理・検索できます。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/IwatsukaYura"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  # 検索ページ用（Fuse.js）
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# メニュー
[[menu.main]]
  identifier = "posts"
  name = "記事"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "archives"
  name = "アーカイブ"
  url = "/archives/"
  weight = 20
[[menu.main]]
  identifier = "tags"
  name = "タグ"
  url = "/tags/"
  weight = 30
[[menu.main]]
  identifier = "sources"
  name = "投稿元"
  url = "/sources/"
  weight = 40
[[menu.main]]
  identifier = "search"
  name = "検索"
  url = "/search/"
  weight = 50

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
  [markup.goldmark.renderer]
    unsafe = true   # 記事内の生HTMLを許可

# パーマリンク：/YYYY/MM/slug/ で年月が URL に反映
[permalinks]
  posts = "/:year/:month/:slug/"
  external = "/external/:slug/"
