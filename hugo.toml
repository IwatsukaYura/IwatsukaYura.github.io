baseURL = "https://iwatsukayura.github.io/"
locale = "ja-jp"
defaultContentLanguage = "ja"
title = "Iwatsuka Yura Blog"

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 12

# タクソノミー：タグ + 外部投稿元(source)でフィルタ可能に
[taxonomies]
  tag = "tags"
  source = "sources"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON は検索用

[params]
  env = "production"
  description = "クラウドとインフラの技術ブログ。Zenn の投稿もここに集約しています。"
  author = "Iwatsuka Yura"
  mainSections = ["posts", "external"]
  brand = "iwatsuka yura"

  # サイドバーのプロフィール
  [params.profile]
    avatar = "https://github.com/IwatsukaYura.png"
    name = "Iwatsuka Yura"
    role = "3-shake / cloud infra"
    bio = "クラウドとインフラを中心に技術記事を書いています。"
    github = "https://github.com/IwatsukaYura"

  # 検索（Fuse.js）
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    ignoreLocation = true
    threshold = 0.35
    minMatchCharLength = 1
    keys = ["title", "summary", "tags", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "archive"
    url = "/archives/"
    weight = 30

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true   # 記事内の生HTMLを許可

# パーマリンク：/YYYY/MM/slug/ で年月が URL に反映
[permalinks]
  posts = "/:year/:month/:slug/"
  external = "/external/:slug/"
