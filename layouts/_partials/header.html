{{- $page := . -}}
<header class="masthead">
  <div class="shell masthead__inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Params.brand | default site.Title }}</a>

    <nav class="nav" aria-label="サイト">
      {{- range site.Menus.main }}
      {{- $url := .URL | relLangURL }}
      {{- $active := or (hasPrefix $page.RelPermalink $url) (and (eq .Identifier "posts") (in site.Params.mainSections $page.Section)) }}
      <a class="nav__link{{ if $active }} is-current{{ end }}" href="{{ $url }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}

      <a class="nav__icon" href="{{ "search/" | relURL }}" aria-label="記事を検索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      </a>

      <button class="nav__icon" type="button" id="theme-toggle" aria-label="配色を切り替える">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>
